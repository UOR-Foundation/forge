# Every upstream fix this repository carries as a local patch, and how to tell
# that a release ships it. Policy: patch the upstream, open its PR, pin to the
# patch, and re-pin to the release once it ships. upstream.yml reads this file
# every hour (scripts/ci/upstream.py, ported from prism-devrel). Adopting a fix
# is adding its row: while no release carries it, a row that names a patched
# `image` gets template-update.yml dispatched to pin that image, once. When a
# release carries the fix, an issue names the release and the re-pin to it is
# dispatched the same way. Delete the row when the re-pin lands.
#
#   image     the patched SDK image that carries the fix until a release does
#   fix       the upstream commit that carries the fix, once merged; until then
#             `pull` is followed to its merge commit.
#   release   how a release is found:
#               ghcr  an image repository tagged sha-<commit> per build
#               npm   a package whose versions record gitHead
#               branch  the upstream default branch, once it contains the fix
#   repin     "template-update" dispatches template-update.yml; "issue" only reports.

[[patch]]
id = "prismpm-sdk-view-closure"
what = "The SDK is ghcr.io/afflom/prismpm-sdk-patched (prism-devrel's sdk-patch.yml): the pinned candidate plus prismpm with the browser closure v2 fix. Without it prismpm verify ends PP5004 (application regeneration artifact closure differs) for any model with a Design facet, Foundry's own included."
pinned = "prismpm.lock, .devcontainer/devcontainer.json, template.lock"
image = "ghcr.io/afflom/prismpm-sdk-patched@sha256:3dfa5f7284ace57c08bfe8d2effe2e08ab41da1a53f5820d48cccd498bd528c3"
repository = "UOR-Foundation/PrismPM"
pull = 615
fix = "359d7f5bfa8e01272ba6028c30c94459420ebb6a"
release = { kind = "ghcr", image = "ghcr.io/uor-foundation/prismpm-sdk-candidate" }
repin = "template-update"

[[patch]]
id = "prismpm-holo-v5-kappa"
what = "Holo v5: a holo is a UORC archive named by its κ (PrismPM #663, ADR-017). Foundry pins the first release that carries it; its holo-bound identities (kernel.json digest, kernel-pin, the publication archiveFingerprint, the frame's holo entries, prism-code's spec seal) then move to κ on Foundry #173's branch."
pinned = "prismpm.lock, .devcontainer/devcontainer.json, template.lock"
repository = "UOR-Foundation/PrismPM"
pull = 663
release = { kind = "ghcr", image = "ghcr.io/uor-foundation/prismpm-sdk-candidate" }
repin = "template-update"
