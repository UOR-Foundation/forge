# Project-owned preparation. The artifact is a proposed source-bound patch, never acceptance evidence.
name: canonical generation
on:
  pull_request:
    paths:
      - 'model/**'
      - 'app/**'
      - 'crates/**'
      - 'xtask/**'
      - 'features/**'
      - 'prismpm.lock'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'Justfile'
      - '.github/workflows/**'
      - 'studio/tools/canonical_generation*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact event revision without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the generation boundary before any writers
        run: node --test studio/tools/canonical_generation.test.mjs
      - name: Run canonical writers only through the immutable SDK
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          image=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("prismpm.lock","utf8")).sdk_image)')
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then exit 64; fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          # No socket, credentials, token or host cache enters this generation container.
          docker --config "$docker_config" run --rm \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" bash -euo pipefail -c 'mkdir -p "$HOME"; cargo fmt --all && just model-write && cd app && lexlean lock && lexlean fmt --all && lexlean lock'
      - name: Refuse unexpected writes and collect the exact source-bound patch
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code HEAD -- studio/tools/canonical_generation.mjs
          node studio/tools/canonical_generation.mjs collect "$SOURCE" "$RUNNER_TEMP/canonical-generation"
      - name: Keep proposed generated changes for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: canonical-generation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/canonical-generation/canonical.patch
            ${{ runner.temp }}/canonical-generation/receipt.json
          if-no-files-found: error
