# Pins the Forge kernel the shell runs to the kernel app/ now builds, so nobody pins it by hand.
# Project content, not universal policy.
#
# Forge runs the kernel guest that studio/KERNEL_REV pins: the holo's archive fingerprint, and the URL of the
# commit that archives it in studio/shell/kernel/kernel.holo. Pinning by hand meant a local SDK build of some
# 15 minutes, two commits (the holo, then the URL naming that commit), and a conflict in the committed
# binaries whenever two branches changed the kernel. Here the same pin is made in CI from the locked SDK:
# when app/ changes on main, or when started for a branch. The holo is built and proved by `just app`
# exactly as pages.yml builds it; the Kernel gate (tools/kernel.mjs --check) and the kernel's boundary tests
# must pass before anything is pushed; nothing is pushed when the pin is already current.
#
# Commits pushed with this workflow's token start no other workflow, so on main it starts the deploy itself.
name: kernel pin

on:
  # One proof of one commit: the page build (pages.yml) proves the kernel to publish it, and the pin takes
  # that holo from its run. A pin started by hand for a branch has no such run, so it proves the branch
  # itself. Nothing about what is proved changes: the holo pinned here is the one Lean proved on this
  # commit, and this job verifies the signature over those exact bytes before it pins them.
  workflow_run:
    workflows: [pages]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: The branch to pin the kernel on.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: kernel-pin-${{ inputs.ref || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  pin:
    name: pin the kernel the shell runs to the one app/ builds
    if: >-
      github.repository != 'UOR-Foundation/template'
      && (github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      attestations: read
    env:
      REF: ${{ inputs.ref || github.event.workflow_run.head_branch }}
    steps:
      - name: Check out the branch to pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The page build of this commit proved this holo and signed it. Taking it is not trust in a cache: the
      # bytes are checked against the signed statement GitHub keeps for the run that built them, and the
      # Kernel gate and the kernel's boundary tests below still run on them before anything is pushed.
      - name: Take the holo this commit's page build proved, and check its signature
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p .pin
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name kernel-holo --dir .pin
          test -s .pin/app.holo
          gh attestation verify .pin/app.holo --repo "$GITHUB_REPOSITORY"
          fingerprint=$(node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(a.attestations.build.id)' .pin/app.json)
          [[ $fingerprint =~ ^[0-9a-f]{64}$ ]]
          {
            echo "HOLO_PATH=.pin/app.holo"
            echo "HOLO_FINGERPRINT=$fingerprint"
          } >>"$GITHUB_ENV"
      - name: Build and verify the holo through the locked SDK
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" just app
      - name: Find the holo, and whether the pin is already current
        id: holo
        shell: bash
        env:
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The commit whose app/ the holo was built from: the page build's, or the branch as checked out.
          echo "source=${BUILT:-$(git rev-parse HEAD)}" >>"$GITHUB_OUTPUT"
          if [[ -n "${HOLO_PATH:-}" ]]; then
            holos=("$HOLO_PATH")
            fingerprint=$HOLO_FINGERPRINT
          else
            holos=(app/.prism/build/*/*.holo)
            if [[ ${#holos[@]} -ne 1 ]]; then
              printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
              exit 64
            fi
            fingerprint=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archive_fingerprint)' "$(dirname "${holos[0]}")/application/holo-identities.json")
          fi
          pinned=$(sed -n 2p studio/KERNEL_REV)
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
            if [[ $pinned == "blake3:$fingerprint" ]]; then echo "current=true"; else echo "current=false"; fi
          } >>"$GITHUB_OUTPUT"
          printf 'built blake3:%s, pinned %s\n' "$fingerprint" "$pinned"
      - name: Archive the holo, then name the commit that archives it
        if: steps.holo.outputs.current != 'true'
        shell: bash
        env:
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          SOURCE: ${{ steps.holo.outputs.source }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Kept as a file: the push below replays these two commits onto a newer tip of the branch.
          cat >"$RUNNER_TEMP/archive.sh" <<'ARCHIVE'
          set -euo pipefail
          pin() { printf 'https://raw.githubusercontent.com/%s/%s/studio/shell/kernel/kernel.holo\nblake3:%s\n' "$GITHUB_REPOSITORY" "$1" "$FINGERPRINT" >studio/KERNEL_REV; }
          cp "$HOLO" studio/shell/kernel/kernel.holo
          pin "$(git rev-parse HEAD)"
          (cd studio && node tools/kernel.mjs)
          git add studio/shell/kernel studio/KERNEL_REV
          git commit -m "Archive the kernel holo app/ builds (blake3:${FINGERPRINT:0:8})" -m "Built and proved by the locked SDK in the kernel pin workflow, from ${SOURCE}."
          pin "$(git rev-parse HEAD)"
          (cd studio && node tools/kernel.mjs)
          git add studio/shell/kernel studio/KERNEL_REV
          git commit -m "KERNEL_REV names the commit that archives the kernel holo"
          ARCHIVE
          bash "$RUNNER_TEMP/archive.sh"
      - name: The Kernel gate and the kernel's boundary tests, on the new pin
        if: steps.holo.outputs.current != 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd studio && node tools/kernel.mjs --check)
          node --test studio/tools/kernel_boundary.test.mjs
      # The build takes some twenty minutes and main often moves meanwhile, so a refused push is expected.
      # The pin is true only of a base whose app/ and SDK lock are the ones the holo was built from: on a
      # refusal the two pin commits are replayed onto the new tip, which is gated again, as long as that
      # stays so. When it does not, this pin is stale and the page build of the newer change pins that one.
      - name: Push the pin
        id: push
        if: steps.holo.outputs.current != 'true'
        shell: bash
        # The checkout keeps no credentials; the token is handed to these pushes and fetches and to nothing else.
        env:
          GH_TOKEN: ${{ github.token }}
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          SOURCE: ${{ steps.holo.outputs.source }}
        run: |
          set -euo pipefail
          origin="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if ! git diff --quiet "$SOURCE" HEAD~2 -- app/ prismpm.lock; then
              echo "::notice::app/ on $REF is no longer what blake3:${FINGERPRINT:0:8} was built from ($SOURCE); not pinning it"
              exit 0
            fi
            if git push "$origin" "HEAD:$REF"; then
              echo "pushed=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --quiet "$origin" "$REF"
            if ! git diff --quiet "$SOURCE" FETCH_HEAD -- app/ prismpm.lock; then
              echo "::notice::app/ on $REF changed since blake3:${FINGERPRINT:0:8} was built from $SOURCE; not pinning it"
              exit 0
            fi
            if [[ $(git show FETCH_HEAD:studio/KERNEL_REV | sed -n 2p) == "blake3:$FINGERPRINT" ]]; then
              echo "::notice::$REF already pins blake3:${FINGERPRINT:0:8}"
              exit 0
            fi
            echo "push $attempt refused; replaying the pin onto the new tip of $REF"
            git reset --quiet --hard FETCH_HEAD
            bash "$RUNNER_TEMP/archive.sh"
            (cd studio && node tools/kernel.mjs --check)
            node --test studio/tools/kernel_boundary.test.mjs
          done
          echo "::error::five pushes to $REF were refused"
          exit 1
      - name: Deploy the site with the new pin
        if: steps.push.outputs.pushed == 'true' && env.REF == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
