# Coordinate build.yml, then prepare the existing two-commit archive/pin update.
# Preparation is not a release. Publication is an explicit owner dispatch only.
name: kernel pin

# reuse-exempt: signed replicas are recovered by complete input/source identity; independent runs never restore build outputs
on:
  push:
    branches: [main]
    paths: ["*", "app/**", ".cargo/**", ".github/workflows/build.yml", "studio/tools/kernel_adoption.mjs"]
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, build and prepare an adoption bundle, or explicitly publish the verified pin.
        type: choice
        options: [plan, prepare, publish]
        default: plan

permissions:
  contents: read

concurrency:
  group: kernel-pin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: inspect exact kernel inputs without mutation
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Describe the exact event source and captured main target
        run: node studio/tools/kernel_adoption.mjs --source "$GITHUB_SHA" --target main
  pin:
    name: reproduce the exact kernel and prepare its verified adoption
    # Never execute supplied branch code with write access or substitute another checkout.
    if: github.repository == 'UOR-Foundation/foundry' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode != 'plan')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write
    env:
      MODE: ${{ inputs.mode || 'prepare' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the locked production archive verifier
        run: npm ci --prefix studio/tools/kernel-adoption --ignore-scripts --no-audit --no-fund
      - name: Capture source and target without mutation
        shell: bash
        run: |
          set -euo pipefail
          node studio/tools/kernel_adoption.mjs --source "$GITHUB_SHA" --target main
      - name: Recover or request two exact-source signed constructions, then prepare
        shell: bash
        run: |
          set -euo pipefail
          args=(--source "$GITHUB_SHA" --target main --state "$RUNNER_TEMP/kernel-adoption")
          node studio/tools/kernel_adoption.mjs --mode build "${args[@]}"
          node studio/tools/kernel_adoption.mjs --mode prepare "${args[@]}"
          prepared=$(jq -r .worktree "$RUNNER_TEMP/kernel-adoption/prepared.json")
          if [[ $prepared != null ]]; then
            (cd "$prepared" && node --test studio/tools/kernel_boundary.test.mjs)
          fi
          head=$(jq -r .head "$RUNNER_TEMP/kernel-adoption/prepared.json")
          if [[ $head != "$GITHUB_SHA" ]]; then
            branch=$(jq -r .branch "$RUNNER_TEMP/kernel-adoption/prepared.json")
            git bundle create "$RUNNER_TEMP/kernel-adoption/adoption.bundle" "$branch" "^$GITHUB_SHA"
          fi
      - name: Publish only on explicit owner dispatch, comparing the remote first
        if: github.event_name == 'workflow_dispatch' && env.MODE == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          # Auth is supplied to this push only. No credential helper or persistent token.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          node studio/tools/kernel_adoption.mjs --mode publish --source "$GITHUB_SHA" \
            --target main --state "$RUNNER_TEMP/kernel-adoption"
      - name: Preserve the reviewable preparation and exact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kernel-adoption-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kernel-adoption/plan.json
            ${{ runner.temp }}/kernel-adoption/receipt.json
            ${{ runner.temp }}/kernel-adoption/prepared.json
            ${{ runner.temp }}/kernel-adoption/published.json
            ${{ runner.temp }}/kernel-adoption/dispatch.json
            ${{ runner.temp }}/kernel-adoption/adoption.bundle
          if-no-files-found: warn
