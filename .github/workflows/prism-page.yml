# The Prism page under app/, measured on the pull request that changes it, not after it merged.
# Project content, not universal policy.
#
# Lighthouse at 100 on mobile (lighthouserc.json, pinned by frame.lock) used to run only in pages.yml, after
# a change was on main: a slower page landed first and then stopped every deploy, for everyone, until
# someone traced it. Here it runs on the pull request, where its author sees it. The page is built exactly as
# pages.yml builds it (the locked SDK, the drawn images, page.mjs and precache.mjs), except that nothing is
# signed: a pull request has no deploy to attest, so the page names this run in place of the signed
# statement. Only pull requests that change what the page is built from are measured.
name: prism page

on:
  pull_request:
    # Only what the page is built from: the kernel, the page, its frame and brand, and the SDK lock. Proving the
    # kernel takes some 15 minutes, so a pull request that cannot change the page does not pay for it.
    paths:
      - "app/**"
      - "site/**"
      - "bootstrap/**"
      - "try/**"
      - "lighthouserc.json"
      - "frame.lock"
      - "brand.lock"
      - "prismpm.lock"
      - ".github/workflows/prism-page.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-page-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: the Prism page at 100 on mobile
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the brand and the frame against brand.lock and frame.lock
        shell: bash
        run: |
          set -euo pipefail
          node bootstrap/brand-sync.mjs --check
          python3 -I bootstrap/brand-fonts.py --check
          node bootstrap/frame-sync.mjs --check
      - name: Build and verify the holo through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" just app
      - name: Find the holo
        id: holo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          holos=(app/.prism/build/*/*.holo)
          if [[ ${#holos[@]} -ne 1 ]]; then
            printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
            exit 64
          fi
          fingerprint=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archive_fingerprint)' "$(dirname "${holos[0]}")/application/holo-identities.json")
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"
      - name: Draw the social image and the icons for this app.json
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/draw"
          "$RUNNER_TEMP/draw/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r bootstrap/draw-requirements.txt
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/og.py
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/icons.py
      - name: Assemble the page
        shell: bash
        env:
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cp "$HOLO" site/app.holo
          cp -r try/vendor site/vendor
          rm -rf site/vendor/prism-code/fixtures
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [id, url] = process.argv.slice(1);
            const app = JSON.parse(readFileSync("site/app.json", "utf8"));
            app.attestations ??= {};
            app.attestations.build = { id, url };
            writeFileSync("site/app.json", `${JSON.stringify(app, null, 2)}\n`);
          ' "$FINGERPRINT" "$RUN_URL"
          node bootstrap/page.mjs site
          node bootstrap/precache.mjs site
      - name: Lighthouse at 100 on mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global @lhci/cli@0.15.1
          lhci autorun --config=lighthouserc.json
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prism-page-lighthouse
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
