name: Try Prism codespace

on:
  push:
    branches: [main]
    paths-ignore:
      - "studio/**"
      - "v2/**"
  pull_request:
    # Forge (studio/) is not read by the try page, the frame, the identity page or the try codespace: a pull
    # request that changes only Forge or the v2/ prototypes does not wait for them.
    paths-ignore:
      - "studio/**"
      - "v2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: try-codespace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: devcontainer up and replay 22/22
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install the devcontainer CLI
        run: npm install --global @devcontainers/cli@0.89.0
      - name: Start the try-tier devcontainer
        run: devcontainer up --workspace-folder . --config .devcontainer/try/devcontainer.json
      - name: Replay the acceptance vectors inside it
        run: devcontainer exec --workspace-folder . --config .devcontainer/try/devcontainer.json bash -lc './node_modules/.bin/prism-code vectors try/vendor/prism-code/fixtures/Calculator.holo'
