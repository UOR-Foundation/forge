# Clean incident replacement of the last-live e7d1703 source, never a feature promotion.
# All artifacts are rebuilt from this exact event revision without Actions caches.
# Complete two-architecture SDK and Studio acceptance precede signing/build and
# the normal github-pages environment precedes deployment. No repository keys
# are exported. Producer and final combined trees fail closed on forbidden paths.
name: pages

on:
  push:
    branches: [containment/foundry-clean-pages-e7d]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  acceptance:
    name: acceptance / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Use only fresh run-local package and browser state
        working-directory: .
        shell: bash
        run: |
          printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/npm-clean-pages" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/playwright-clean-pages" >> "$GITHUB_ENV"
          printf 'FORGE_LANE_WORK=%s\n' "$RUNNER_TEMP/forge-lane-clean-pages" >> "$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the build to clean exact source bytes
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/source-evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-evidence/tree.txt"
          git archive --format=tar HEAD | sha256sum > "$RUNNER_TEMP/source-evidence/archive.sha256"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-evidence/files.txt"
          sha256sum prismpm.lock lighthouserc.json > "$RUNNER_TEMP/source-evidence/locks.sha256"
      - name: Run the template gate through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            --env SDK_IMAGE="$image" \
            "$image" bash -c '
              set -euo pipefail
              umask 077
              docker buildx version
              docker buildx inspect --bootstrap
              manifest=$(docker buildx imagetools inspect "$SDK_IMAGE")
              grep -q "linux/amd64" <<< "$manifest"
              grep -q "linux/arm64" <<< "$manifest"
              devcontainer --version
              exec just vv
            '

  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Use only fresh run-local package and browser state
        working-directory: .
        shell: bash
        run: |
          printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/npm-clean-pages" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/playwright-clean-pages" >> "$GITHUB_ENV"
          printf 'FORGE_LANE_WORK=%s\n' "$RUNNER_TEMP/forge-lane-clean-pages" >> "$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the build to clean exact source bytes
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/source-evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-evidence/tree.txt"
          git archive --format=tar HEAD | sha256sum > "$RUNNER_TEMP/source-evidence/archive.sha256"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-evidence/files.txt"
          sha256sum prismpm.lock lighthouserc.json > "$RUNNER_TEMP/source-evidence/locks.sha256"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The authored model is what the author script writes
        run: python3 tools/author.py && git diff --exit-code -- src/Forge.lex.tex
      - name: The lane, byte compared against the committed artifacts
        run: ./scripts/lane.sh
      - name: Byte identity corpus
        run: python3 tools/corpus.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: ""
      - name: Every shell script parses the way the browser parses it
        run: node tools/shell_parse.mjs
      - name: The build screen opens Dark, keeps its own choice, and leaves the home look alone
        run: node tools/build_look.mjs
      - name: The kernel in the shell is the holo KERNEL_REV pins, and every vector replays
        run: node tools/kernel.mjs --check
      - name: The Prism journey in the shell is prism-code's, byte for byte
        run: node tools/prism_journey.mjs --check
      - name: The commit Forge makes on a template instance is prism-code's, byte for byte
        run: node tools/prism_template.mjs --check
      - name: The live frame's shadcn/ui components are the vendored ones, and rebuild byte for byte
        run: (cd live-src && npm ci --no-audit --no-fund) && node tools/live_components.mjs --check
      - name: The live preview draws the spec, and only the spec
        run: node tools/live_preview.mjs --check
      - name: The decision table decides as the rules do, on every request
        run: node tools/live_table.mjs --check
      - name: Every word on the live screen is edited in the spec, and only there
        run: node tools/live_edit.mjs --check
      - name: Nothing in this repository names Forge's old home
        run: node tools/self_contained.mjs

  browser:
    name: headless browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Use only fresh run-local package and browser state
        working-directory: .
        shell: bash
        run: |
          printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/npm-clean-pages" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/playwright-clean-pages" >> "$GITHUB_ENV"
          printf 'FORGE_LANE_WORK=%s\n' "$RUNNER_TEMP/forge-lane-clean-pages" >> "$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: ""
      - name: Install the test runner
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        # The runner image carries the libraries Chromium needs (it ships Chrome itself), so no system
        # packages are installed: they come from Ubuntu's mirror, which has failed runs for want of DNS.
        # Only if the browser cannot start are they installed, with apt's own retries.
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npx playwright install chromium && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep $((attempt * 20))
          done
          if ! node -e 'require("playwright").chromium.launch().then((b) => b.close())'; then
            for attempt in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update && npx playwright install-deps chromium && break
              [[ $attempt -lt 3 ]] || exit 1
              sleep $((attempt * 30))
            done
          fi
      - name: Verify, answer add 20 22 and replay 22/22
        run: npm run test:try
      - name: Prism accounts - every signature check refuses, and the passkey flow signs in
        run: npm run test:identity
      - name: Build the canonical frame every Prism app loads
        run: node frame/publish.mjs "$RUNNER_TEMP/frame" "$GITHUB_SHA"
      - name: Build the sign-in page for id.uor.foundation, pinned by hash
        run: node identity/publish.mjs "$RUNNER_TEMP/identity" "$GITHUB_SHA"


  codespace:
    name: devcontainer up and replay 22/22
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Use only fresh run-local package and browser state
        working-directory: .
        shell: bash
        run: |
          printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/npm-clean-pages" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/playwright-clean-pages" >> "$GITHUB_ENV"
          printf 'FORGE_LANE_WORK=%s\n' "$RUNNER_TEMP/forge-lane-clean-pages" >> "$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: ""
      - name: Install the devcontainer CLI
        run: npm install --global @devcontainers/cli@0.89.0
      - name: Start the try-tier devcontainer
        run: devcontainer up --workspace-folder . --config .devcontainer/try/devcontainer.json
      - name: Replay the acceptance vectors inside it
        run: devcontainer exec --workspace-folder . --config .devcontainer/try/devcontainer.json bash -lc './node_modules/.bin/prism-code vectors try/vendor/prism-code/fixtures/Calculator.holo'

  build:
    name: build and verify the holo, sign its provenance, assemble the page
    needs: [acceptance, studio, browser, codespace]
    # The template repository publishes its try page instead (try-page.yml).
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Use only fresh run-local package and browser state
        working-directory: .
        shell: bash
        run: |
          printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/npm-clean-pages" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/playwright-clean-pages" >> "$GITHUB_ENV"
          printf 'FORGE_LANE_WORK=%s\n' "$RUNNER_TEMP/forge-lane-clean-pages" >> "$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the build to clean exact source bytes
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/source-evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-evidence/tree.txt"
          git archive --format=tar HEAD | sha256sum > "$RUNNER_TEMP/source-evidence/archive.sha256"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-evidence/files.txt"
          sha256sum prismpm.lock lighthouserc.json > "$RUNNER_TEMP/source-evidence/locks.sha256"
      - name: Check the brand and the frame against brand.lock and frame.lock
        shell: bash
        run: |
          set -euo pipefail
          node bootstrap/brand-sync.mjs --check
          python3 -I bootstrap/brand-fonts.py --check
          node bootstrap/frame-sync.mjs --check
      - name: Build and verify the holo through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" just app
      - name: Find the holo
        id: holo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          holos=(app/.prism/build/*/*.holo)
          if [[ ${#holos[@]} -ne 1 ]]; then
            printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
            exit 64
          fi
          fingerprint=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archive_fingerprint)' "$(dirname "${holos[0]}")/application/holo-identities.json")
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"
      - name: Sign the holo's provenance as this repository's workflow
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false
      - name: Draw the social image and the icons for this app.json
        # page.mjs refuses an og.png or icon not drawn for this app.json. Drawing
        # them here, with Pillow pinned by hash, means a new app needs neither
        # Python nor Pillow on its author's machine; the committed images only
        # serve a local preview.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/draw"
          "$RUNNER_TEMP/draw/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r bootstrap/draw-requirements.txt
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/og.py
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/icons.py
      - name: Assemble the page
        shell: bash
        env:
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$HOLO" site/app.holo
          cp -r try/vendor site/vendor
          rm -rf site/vendor/prism-code/fixtures
          # The page says where this holo's provenance is: the signed statement
          # GitHub keeps for the build that made it.
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [id, url] = process.argv.slice(1);
            const app = JSON.parse(readFileSync("site/app.json", "utf8"));
            app.attestations ??= {};
            app.attestations.build = { id, url };
            writeFileSync("site/app.json", `${JSON.stringify(app, null, 2)}\n`);
          ' "$FINGERPRINT" "$ATTESTATION_URL"
          node bootstrap/page.mjs site
          node bootstrap/precache.mjs site
      - name: Lighthouse at 100 on mobile, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global @lhci/cli@0.15.1
          lhci autorun --config=lighthouserc.json
      - name: Every Material 3 window size class, both themes, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global playwright@1.56.1
          # The runner image carries the libraries Chromium needs (it ships Chrome itself), so no system
          # packages are installed: they come from Ubuntu's mirror, which has failed runs for want of DNS.
          # Only if the browser cannot start are they installed, with apt's own retries.
          for attempt in 1 2 3; do
            playwright install chromium && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep $((attempt * 20))
          done
          if ! NODE_PATH=$(npm root --global) node -e 'require("playwright").chromium.launch().then((b) => b.close())'; then
            for attempt in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update && playwright install-deps chromium && break
              [[ $attempt -lt 3 ]] || exit 1
              sleep $((attempt * 30))
            done
          fi
          node bootstrap/screens.mjs site screens
      - name: Keep the screens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
      - name: Reject forbidden files and inventory the complete prism export
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: python3 -I -B bootstrap/pages-export.py --source "$SOURCE_COMMIT" site > "$RUNNER_TEMP/prism-inventory.json"
      - name: Keep the Prism page, deployed under app/ beside Forge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prism-page
          path: site
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve the prism inventory and source binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-pages-prism-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/prism-inventory.json
            ${{ runner.temp }}/source-evidence

  forge:
    name: build Forge (studio/), the app builder at the site's root
    needs: [acceptance, studio, browser, codespace]
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Use only fresh run-local package and browser state
        working-directory: .
        shell: bash
        run: |
          printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/npm-clean-pages" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/playwright-clean-pages" >> "$GITHUB_ENV"
          printf 'FORGE_LANE_WORK=%s\n' "$RUNNER_TEMP/forge-lane-clean-pages" >> "$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the build to clean exact source bytes
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/source-evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-evidence/tree.txt"
          git archive --format=tar HEAD | sha256sum > "$RUNNER_TEMP/source-evidence/archive.sha256"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-evidence/files.txt"
          sha256sum prismpm.lock lighthouserc.json > "$RUNNER_TEMP/source-evidence/locks.sha256"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The lane, which projects the page from the verified core and builds the wasm the page loads
        run: ./scripts/lane.sh
      - name: Byte identity corpus and shell hash check
        run: python3 tools/corpus.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: ""
      - name: Every shell script parses the way the browser parses it
        run: node tools/shell_parse.mjs
      - name: The build screen opens Dark, keeps its own choice, and leaves the home look alone
        run: node tools/build_look.mjs
      - name: The vendored renderer, built beside the shell as the homepage (no Electron, no src/pro)
        run: cd vendor/dyad && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --ignore-scripts --engine-strict=false --force --no-audit --no-fund --loglevel=error && npx vite build --config vite.shell.config.mts --base /foundry/ --outDir dist --emptyOutDir && python3 ../../scripts/stamp_shell.py
      - name: The host answers the renderer's own contracts (the renderer's node_modules are installed by now)
        run: node tools/contract_shapes.mjs --check
      - name: Every screen calls the kit's shadcn/ui components as Radix takes them (the build above refuses Base UI or a Dyad copy in the bundle)
        run: cd vendor/dyad && node hologram.typecheck.mjs
      - name: The served site names nothing outside this repository
        run: node tools/self_contained.mjs shell
      - name: Reject forbidden files and inventory the complete forge export
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: python3 -I -B bootstrap/pages-export.py --source "$SOURCE_COMMIT" studio/shell > "$RUNNER_TEMP/forge-inventory.json"
      - name: Keep Forge's site, deployed at the root
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-site
          path: studio/shell
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve the forge inventory and source binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-pages-forge-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/forge-inventory.json
            ${{ runner.temp }}/source-evidence

  deploy:
    name: publish Forge at the root and its Prism page under app/
    needs: [acceptance, studio, browser, codespace, build, forge]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Use only fresh run-local package and browser state
        working-directory: .
        shell: bash
        run: |
          printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/npm-clean-pages" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/playwright-clean-pages" >> "$GITHUB_ENV"
          printf 'FORGE_LANE_WORK=%s\n' "$RUNNER_TEMP/forge-lane-clean-pages" >> "$GITHUB_ENV"
      - name: Check out the exact reviewed event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Forge, at the root
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: forge-site
          path: out
      - name: Require a separate new Prism destination
        run: test ! -e out/app
      - name: The Prism page, under app/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prism-page
          path: out/app
      - name: Restore only this run's Forge inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: clean-pages-forge-evidence-${{ github.sha }}
          path: evidence/forge
      - name: Restore only this run's Prism inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: clean-pages-prism-evidence-${{ github.sha }}
          path: evidence/prism
      - name: Verify this run's combined inventory against both producer inventories
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B bootstrap/pages-export.py --source "$SOURCE_COMMIT" ./out > "$RUNNER_TEMP/combined-before.json"
          python3 -I - "$RUNNER_TEMP/combined-before.json" "$SOURCE_COMMIT" <<'PYTHON'
          import json, re, sys
          from pathlib import Path, PurePosixPath
          combined = json.loads(Path(sys.argv[1]).read_text())
          forge = json.loads(Path('evidence/forge/forge-inventory.json').read_text())
          prism = json.loads(Path('evidence/prism/prism-inventory.json').read_text())
          policy = json.loads(Path('model/pages-release.json').read_text())
          def validate(record):
              invalid = policy['diagnostics']['invalid']
              if not isinstance(record, dict) or set(record) != {'schema', 'source_commit', 'files'}:
                  raise SystemExit(invalid)
              if record['schema'] != policy['schema']:
                  raise SystemExit(invalid)
              if record['source_commit'] != sys.argv[2]:
                  raise SystemExit(policy['diagnostics']['source'])
              rows = record['files']
              if not isinstance(rows, list) or not rows:
                  raise SystemExit(invalid)
              paths = []
              for row in rows:
                  if not isinstance(row, dict) or set(row) != {'path', 'size', 'sha256'}:
                      raise SystemExit(invalid)
                  path = row['path']
                  if not isinstance(path, str) or not path or path.startswith('/') or '\\' in path:
                      raise SystemExit(invalid)
                  parts = path.split('/')
                  if any(part in ['', '.', '..'] for part in parts) or any(ord(c) < 32 for c in path):
                      raise SystemExit(invalid)
                  if any(part in policy['forbidden_basenames'] for part in parts):
                      raise SystemExit(policy['diagnostics']['forbidden'])
                  if PurePosixPath(path).as_posix() != path:
                      raise SystemExit(invalid)
                  if type(row['size']) is not int or row['size'] < 0:
                      raise SystemExit(invalid)
                  if not isinstance(row['sha256'], str) or not re.fullmatch('[0-9a-f]{64}', row['sha256']):
                      raise SystemExit(invalid)
                  paths.append(path)
              if paths != sorted(set(paths)):
                  raise SystemExit(invalid)
          for record in [combined, forge, prism]:
              validate(record)
          expected = forge['files'] + [dict(x, path='app/' + x['path']) for x in prism['files']]
          if combined['files'] != sorted(expected, key=lambda x: x['path']):
              raise SystemExit(policy['diagnostics']['changed'])
          PYTHON
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Reject forbidden files and inventory every combined Pages path
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B bootstrap/pages-export.py --source "$SOURCE_COMMIT" out > "$RUNNER_TEMP/combined-inventory.json"
          cmp "$RUNNER_TEMP/combined-before.json" "$RUNNER_TEMP/combined-inventory.json"
      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: out
      - name: Preserve the complete combined inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clean-pages-combined-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/combined-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
