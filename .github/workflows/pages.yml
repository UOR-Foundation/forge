# Publishes Forge and its Prism page together, as one Pages site:
#   https://uor-foundation.github.io/foundry/      Foundry (studio/), the app builder
#   https://uor-foundation.github.io/foundry/app/  the Foundry kernel's Prism page: `site/` with the holo
#                                                that `just app` builds and verifies through the locked SDK
#   https://uor-foundation.github.io/foundry/reuse/v2/reuse/opfs.html  the address-based reuse store,
#                                                exercised over the browser's own OPFS (v2/reuse)
#   https://uor-foundation.github.io/foundry/v2/index.html  Foundry v2: apps that are LexLean specs, run in
#                                                the tab, with what Lean proved beside each (v2/site)
# Project content, not universal policy: a repository may extend or replace it.
#
# It runs on every push to main, beside `bootstrap`, not after it: `just app`
# is the proof-bearing build (the Lean kernel checks every theorem before the
# holo exists), so the page goes live as soon as that passes, while the rest of
# the gate runs on both architectures. The SDK step and the signing step are
# the ones `build.yml` runs, copied here: the gate pins every `uses:` to a
# commit and so forbids calling a workflow by path. When `build.yml` changes
# either step, copy it again. The page then carries the same holo that
# `prism-code build --remote github` would hand a device, with the signed
# provenance of the run that made it beside it.
#
# Fast and robust by construction:
# - The Prism page is addressed by its inputs: every tracked file outside
#   studio/ (Forge's tree, which the page never reads). A page built,
#   verified, signed and checked by an earlier run for the same address is
#   published again as it was; nothing is rebuilt, re-signed or re-checked,
#   so a Forge-only change waits on no SDK, no signing service and no
#   browser download. Any other change rebuilds the page in full.
# - Outside services a run cannot count on are retried or avoided: signing
#   is tried three times, the public log being able to lag a fresh entry;
#   the screens' browser comes from Playwright's own download, kept by its
#   version, never from Ubuntu's package mirror.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify the holo, sign its provenance, assemble the page
    # The template repository publishes its try page instead (try-page.yml).
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      address: ${{ steps.address.outputs.key }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The page's address, from every file it is built from (all but studio/, v2/ and the other workflows)
        # v2/ holds prototypes no step of this build reads (just app reads app/, bootstrap/, site/), so a
        # change there publishes the page already verified for the same inputs instead of rebuilding it.
        #
        # The other workflow files are left out for the same reason: no step of this job reads one. The
        # steps are this file's own, so this file stays in the key. Before this, a pull request that only
        # added a test step to another workflow changed the address, and main built and proved the kernel again
        # for 28 minutes before it could publish a stylesheet (run of 2248dcd, 2026-11-12). The patterns
        # are read in order: the workflows are taken out, then this one is put back.
        id: address
        shell: bash
        run: echo "key=prism-page-v2-${{ hashFiles('**', '!studio/**', '!v2/**', '!.git/**', '!.github/workflows/**', '.github/workflows/pages.yml') }}" >>"$GITHUB_OUTPUT"
      - name: The page already built, verified and signed from these files, if there is one
        id: reuse
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verified-page
          key: ${{ steps.address.outputs.key }}
      - name: Check the brand and the frame against brand.lock and frame.lock
        if: steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node bootstrap/brand-sync.mjs --check
          python3 -I bootstrap/brand-fonts.py --check
          node bootstrap/frame-sync.mjs --check
      - name: Build and verify the holo through the locked SDK
        if: steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" just app
      - name: Find the holo
        if: steps.reuse.outputs.cache-hit != 'true'
        id: holo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          holos=(app/.prism/build/*/*.holo)
          if [[ ${#holos[@]} -ne 1 ]]; then
            printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
            exit 64
          fi
          fingerprint=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archive_fingerprint)' "$(dirname "${holos[0]}")/application/holo-identities.json")
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"
      # Signing calls Sigstore's public services. Its log can answer 404 for an entry it has just
      # accepted, so a failed signing is tried again after a wait, three times in all.
      - name: Sign the holo's provenance as this repository's workflow
        id: attest1
        if: steps.reuse.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false
      - name: Wait before signing again
        if: steps.reuse.outputs.cache-hit != 'true' && steps.attest1.outcome == 'failure'
        run: sleep 45
      - name: Sign the holo's provenance, second try
        id: attest2
        if: steps.reuse.outputs.cache-hit != 'true' && steps.attest1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false
      - name: Wait longer before the last try
        if: steps.reuse.outputs.cache-hit != 'true' && steps.attest2.outcome == 'failure'
        run: sleep 120
      - name: Sign the holo's provenance, last try
        id: attest3
        if: steps.reuse.outputs.cache-hit != 'true' && steps.attest2.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false
      - name: The signed statement the page names
        id: attest
        if: steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        env:
          URL: ${{ steps.attest1.outputs.attestation-url || steps.attest2.outputs.attestation-url || steps.attest3.outputs.attestation-url }}
        run: |
          set -euo pipefail
          [[ -n $URL ]] || { printf '%s\n' 'no signing succeeded' >&2; exit 1; }
          echo "attestation-url=$URL" >>"$GITHUB_OUTPUT"
      - name: Draw the social image and the icons for this app.json
        if: steps.reuse.outputs.cache-hit != 'true'
        # page.mjs refuses an og.png or icon not drawn for this app.json. Drawing
        # them here, with Pillow pinned by hash, means a new app needs neither
        # Python nor Pillow on its author's machine; the committed images only
        # serve a local preview.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/draw"
          "$RUNNER_TEMP/draw/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r bootstrap/draw-requirements.txt
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/og.py
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/icons.py
      - name: Assemble the page
        if: steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        env:
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$HOLO" site/app.holo
          cp -r try/vendor site/vendor
          rm -rf site/vendor/prism-code/fixtures
          # The page says where this holo's provenance is: the signed statement
          # GitHub keeps for the build that made it.
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [id, url] = process.argv.slice(1);
            const app = JSON.parse(readFileSync("site/app.json", "utf8"));
            app.attestations ??= {};
            app.attestations.build = { id, url };
            writeFileSync("site/app.json", `${JSON.stringify(app, null, 2)}\n`);
          ' "$FINGERPRINT" "$ATTESTATION_URL"
          node bootstrap/page.mjs site
          node bootstrap/precache.mjs site
      # Lighthouse at 100 on mobile runs on the pull request that changes the page (prism-page.yml), where its
      # author sees it, not here after the merge, where a slower page stopped every deploy until traced.
      - name: The screens' browser, kept by its version
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}-${{ runner.arch }}
      - name: Every Material 3 window size class, both themes, before anything is deployed
        if: steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global playwright@1.56.1
          # The runner image carries the libraries Chromium needs (it ships Chrome itself), so no system
          # packages are installed: they come from Ubuntu's mirror, which has failed runs for want of DNS.
          # Only if the browser cannot start are they installed, with apt's own retries.
          for attempt in 1 2 3; do
            playwright install chromium && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep $((attempt * 20))
          done
          if ! NODE_PATH=$(npm root --global) node -e 'require("playwright").chromium.launch().then((b) => b.close())'; then
            for attempt in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update && playwright install-deps chromium && break
              [[ $attempt -lt 3 ]] || exit 1
              sleep $((attempt * 30))
            done
          fi
          node bootstrap/screens.mjs site screens
      - name: Keep the screens
        if: always() && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
      - name: Keep this page by its address, for the next run built from the same files
        if: steps.reuse.outputs.cache-hit != 'true'
        shell: bash
        run: cp -r site verified-page
      - name: Save the page under its address
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verified-page
          key: ${{ steps.address.outputs.key }}
      - name: Keep the Prism page, deployed under app/ beside Forge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prism-page
          path: ${{ steps.reuse.outputs.cache-hit == 'true' && 'verified-page' || 'site' }}
          if-no-files-found: error
      # One proof of one commit. This holo is the one Lean proved here, signed by this run; the pin takes it
      # from this artifact (kernel-pin.yml) and verifies that signature instead of proving the same model a
      # second time. A commit whose page was reused carries the holo of the page it reused, which is the
      # same holo: the page's address covers every file app/ is built from.
      - name: Keep the kernel's holo, for the pin that names it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kernel-holo
          path: |
            ${{ steps.reuse.outputs.cache-hit == 'true' && 'verified-page/app.holo' || 'site/app.holo' }}
            ${{ steps.reuse.outputs.cache-hit == 'true' && 'verified-page/app.json' || 'site/app.json' }}
          if-no-files-found: error

  forge:
    name: build Forge (studio/), the app builder at the site's root
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      address: ${{ steps.forge-address.outputs.key }}
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Forge's address, from every file its build can read
        # A superset of Forge's inputs: its gates read app/, bootstrap/ and the v2 engine sources.
        # Other v2 prototypes remain excluded; changes to any consumed engine source invalidate reuse.
        id: forge-address
        shell: bash
        working-directory: .
        run: echo "key=forge-site-v1-${{ hashFiles('**', '!v2/**', '!.git/**', 'v2/shell/**', 'v2/loop/**', 'v2/probe-payment/data/**', 'v2/probe-payment/src/**', 'v2/hosted-check/**') }}" >>"$GITHUB_OUTPUT"
      - name: Forge's site already built and gated from these files, if there is one
        id: forge-reuse
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verified-forge
          key: ${{ steps.forge-address.outputs.key }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/hologram-forge-lane
            ~/.elan
          key: lane-${{ hashFiles('studio/PRISMPM_REV', 'studio/lean-toolchain') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/vendor/dyad/package-lock.json
      # The lockfile names every dependency byte, so the unpacked tree is addressed by the lockfile alone:
      # npm ci then has nothing to do. The store setup-node keeps is the tarballs, not this tree.
      - name: The locked dependency trees, at the address of the lockfiles that name them
        id: modules
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            studio/runtime/node_modules
            studio/vendor/dyad/node_modules
          key: forge-modules-v1-${{ hashFiles('studio/runtime/package-lock.json', 'studio/vendor/dyad/package-lock.json') }}
      - name: Install the locked browser compiler archive
        if: steps.forge-reuse.outputs.cache-hit != 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      # The bundle is what the renderer's own files compile to: its address is those files and the lockfile,
      # nothing else. A change to the shell's stylesheet or scripts leaves it alone, and the build below is
      # skipped for a bundle already compiled from these exact bytes. stamp_shell.py always runs: it stages
      # the bundle beside the shell, which the closure check then verifies byte for byte.
      - name: The renderer's bundle already compiled from these files, if there is one
        id: bundle
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: studio/vendor/dyad/dist
          key: forge-bundle-v1-${{ hashFiles('studio/vendor/dyad/**', '!studio/vendor/dyad/node_modules/**', '!studio/vendor/dyad/dist/**') }}
      - name: The vendored renderer's dependencies
        if: steps.forge-reuse.outputs.cache-hit != 'true' && steps.modules.outputs.cache-hit != 'true'
        run: cd vendor/dyad && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --prefer-offline --ignore-scripts --engine-strict=false --force --no-audit --no-fund --loglevel=error
      - name: The vendored renderer, built beside the shell as the homepage (no Electron, no src/pro)
        if: steps.forge-reuse.outputs.cache-hit != 'true' && steps.bundle.outputs.cache-hit != 'true'
        run: cd vendor/dyad && npx vite build --config vite.shell.config.mts --base /foundry/ --outDir dist --emptyOutDir
      - name: The bundle staged beside the shell, with the scaffold and the editor's locked bytes
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: python3 scripts/stamp_shell.py
      - name: The lane, which projects the page from the verified core and builds the wasm the page loads
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: ./scripts/lane.sh
      - name: Independently verify staged editor bytes against the locked npm archive
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: python3 scripts/editor_assets.py --check && python3 scripts/compiler_assets.py --check
      - name: Verify every staged renderer, scaffold and shell byte before acceptance
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: node tools/check_shell_closure.mjs
      - name: Byte identity corpus and shell hash check
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: python3 tools/corpus.py
      - name: Every shell script parses the way the browser parses it
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: node tools/shell_parse.mjs
      - name: The build screen opens Dark, keeps its own choice, and leaves the home look alone
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: node tools/build_look.mjs
      - name: The host answers the renderer's own contracts (the renderer's node_modules are installed by now)
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: node tools/contract_shapes.mjs --check
      - name: The renderer preserves typed host refusals and recovers
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: node tools/renderer_boundary.mjs
      - name: Every screen calls the kit's shadcn/ui components as Radix takes them (the build above refuses Base UI or a Dyad copy in the bundle)
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: cd vendor/dyad && node hologram.typecheck.mjs
      - name: The Experience gate, the stylesheet's hit area, durations and reduced-motion rule held to the kernel's answers
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: node tools/experience.mjs --check
      - name: The Performance gate's static arm, the JS each route needs inside the kernel's budgets (FK-12, FK-15)
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        # Exact, from the build's chunk graph. The browser arm measures time, so it runs on the pull request that
        # changes Forge (forge-perf.yml), not here, where a slower runner would stop the deploy for everyone.
        run: node tools/perf_budget.mjs
      - name: The served site names nothing outside this repository
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: node tools/self_contained.mjs shell
      # The site carries no provider key. Keys written into warmup.json were public to every visitor (see
      # PAGES-CONTAINMENT.md on containment/foundry-clean-pages-e7d); a visitor's own key, kept on their
      # device, is the only key the page uses. A warmup.json anywhere in the site refuses the deploy.
      - name: No provider key in the site
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          found=$(find shell -name warmup.json -print -quit)
          if [[ -n $found ]]; then printf 'refused: %s would publish a provider key\n' "$found" >&2; exit 1; fi
      - name: Keep Forge's site by its address, for the next run built from the same files
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        shell: bash
        run: cp -r shell ../verified-forge
      - name: Save Forge's site under its address
        if: steps.forge-reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verified-forge
          key: ${{ steps.forge-address.outputs.key }}
      - name: Keep Forge's site, deployed at the root
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: forge-site
          path: ${{ steps.forge-reuse.outputs.cache-hit == 'true' && 'verified-forge' || 'studio/shell' }}
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: publish Forge at the root and its Prism page under app/
    needs: [build, forge]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publish at a time, and never an older revision over a newer one: builds now overlap, so a run
    # whose commit is no longer main's head leaves the site to the run that built the head.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: This revision is still the head of the branch it was pushed to
        id: current
        shell: bash
        run: |
          set -euo pipefail
          head=$(git ls-remote "https://github.com/${{ github.repository }}" "${{ github.ref }}" | cut -f1)
          if [[ $head == "${{ github.sha }}" ]]; then echo "publish=true" >>"$GITHUB_OUTPUT"; else echo "publish=false" >>"$GITHUB_OUTPUT"; echo "superseded by $head; that run publishes"; fi
      - name: Forge, at the root
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: forge-site
          path: out
      - name: The Prism page, under app/
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prism-page
          path: out/app
      - name: The address-based reuse page's sources
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            v2/reuse
            v2/shell
            v2/site
            v2/hosted-check
            v2/probe-payment/data
            v2/probe-payment/src
            v2/loop/answers
            studio/shell/prism-code/src/blake3.mjs
          sparse-checkout-cone-mode: false
      - name: The address-based reuse page, under reuse/
        if: steps.current.outputs.publish == 'true'
        # Byte-for-byte copies in the repository's own layout, so the page's relative imports resolve
        # unchanged: https://<owner>.github.io/foundry/reuse/v2/reuse/opfs.html. Forge's worker answers
        # this path from the network, as it does any path it does not own.
        shell: bash
        run: |
          set -euo pipefail
          for f in v2/reuse/opfs.html v2/reuse/adapter/*.mjs v2/reuse/data/*.json v2/shell/interp.mjs studio/shell/prism-code/src/blake3.mjs; do
            for g in src/$f; do rel=${g#src/}; mkdir -p "out/reuse/$(dirname "$rel")"; cp "$g" "out/reuse/$rel"; done
          done
          test -s out/reuse/v2/reuse/opfs.html
          test -s out/reuse/v2/reuse/data/modules.json
      - name: The Foundry v2 page, under v2/
        if: steps.current.outputs.publish == 'true'
        # v2/site/build.mjs copies the files the page serves, byte for byte, and reads the proof table
        # from the specs. Its tests run first: a promise shown without its theorem, a link Forge's
        # worker would swallow, or code past the first-load budget stops the deploy.
        shell: bash
        run: |
          set -euo pipefail
          node --test src/v2/site/test.mjs
          node src/v2/site/build.mjs out/v2
          test -s out/v2/index.html
          test -s out/v2/site/apps.json
      - name: Configure Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload the site
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          # v4 and later leave dotfiles out unless asked: the shell's closure lists .nojekyll, and the
          # worker refuses to install a closure with a file missing, so without this no preview is served.
          include-hidden-files: true
          path: out
      - name: Deploy
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  live:
    # After the deploy, not before it: the live site is checked as visitors get it (the worker installs,
    # every app fixture streams, edits and undoes within its budgets); a miss reports, it never holds a
    # deploy back. The same check runs on every pull request that changes Forge (forge-perf.yml).
    name: every Prism app previews live within its budgets, on the deployed site
    needs: [build, forge, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # What this check reads is the deployed site, and the deployed site is those two addresses: the page's
      # and Forge's. The same two with the same browser have nothing new to show, so the check is kept by
      # that address and a deploy of unchanged bytes costs nothing. A miss runs it in full.
      - name: This exact site, in this exact browser, already previewed live
        id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: studio/live-seen
          key: live-seen-v1-playwright-1.56.1-${{ needs.build.outputs.address }}-${{ needs.forge.outputs.address }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.seen.outputs.cache-hit != 'true'
        with:
          node-version: "24"
      - name: The browser, kept by its version
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}-${{ runner.arch }}
      - name: The browser
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          npm install --no-audit --no-fund --global playwright@1.56.1
          playwright install --with-deps chromium
      - name: Every Prism app previews live within its budgets
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          export PLAYWRIGHT_MODULE="$(npm root --global)/playwright/index.mjs"
          bash scripts/live_e2e_all.sh "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" "$RUNNER_TEMP/live-e2e"
      - name: Keep that these bytes previewed live
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          mkdir -p live-seen
          echo "${{ needs.build.outputs.address }} ${{ needs.forge.outputs.address }}" >live-seen/address
      - name: Keep that under its address
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: studio/live-seen
          key: live-seen-v1-playwright-1.56.1-${{ needs.build.outputs.address }}-${{ needs.forge.outputs.address }}
      - name: Keep what the check saw
        if: always() && steps.seen.outputs.cache-hit != 'true' 
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-e2e
          path: ${{ runner.temp }}/live-e2e
          if-no-files-found: ignore
