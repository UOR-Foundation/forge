# Forge (studio/): its own checks, on every push and pull request that touches it. Project content, not
# universal policy. Forge has its own Rust core and Lean lane (studio/core, studio/src, scripts/lane.sh),
# kept out of the template's Cargo workspace; the template's gate (bootstrap.yml) does not build it, so
# this does. Every `uses:` is pinned to a commit and every checkout keeps full history and no credentials,
# as audit-bootstrap requires of every workflow here.
name: studio

on:
  push:
    branches: [main]
    paths: ["studio/**", ".github/workflows/studio.yml"]
  pull_request:
    paths: ["studio/**", ".github/workflows/studio.yml"]

permissions:
  contents: read

# BEGIN FoundrySpecification.studioConcurrencyYaml
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('studio-pr-{0}', github.event.pull_request.number) || format('studio-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# END FoundrySpecification.studioConcurrencyYaml

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache the lane work directory (PrismPM at the pinned commit, its built LexLean, the Lean toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/hologram-forge-lane
            ~/.elan
          key: lane-${{ hashFiles('studio/PRISMPM_REV', 'studio/lean-toolchain') }}
      - name: Verify the canonical PR concurrency boundary
        run: python3 tools/studio_concurrency_projection.py --check
      - name: The authored model is what the author script writes
        run: python3 tools/author.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/vendor/dyad/package-lock.json
      - name: Install locked renderer contracts for boundary verification
        run: npm ci --prefix vendor/dyad --ignore-scripts --no-audit --no-fund
      - name: Reproduce the imported chat schemas from locked sources
        run: node tools/chat_contracts_projection.mjs --check
      - name: Install the locked browser compiler archive
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      - name: Build the renderer and stage its complete closure before projection
        run: (cd vendor/dyad && node node_modules/vite/bin/vite.js build --config vite.shell.config.mts --base /foundry/ --outDir dist --emptyOutDir) && python3 scripts/stamp_shell.py
      - name: The lane, byte compared against the committed artifacts
        run: ./scripts/lane.sh
      - name: Independently verify staged editor bytes against the locked npm archive
        run: python3 scripts/editor_assets.py --check && python3 scripts/compiler_assets.py --check
      - name: Verify every staged renderer, scaffold and shell byte before acceptance
        run: node tools/check_shell_closure.mjs
      - name: Byte identity corpus
        run: python3 tools/corpus.py
      - name: Check the declared host scope and real renderer error recovery
        run: |
          node tools/contract_shapes.mjs --check
          node tools/renderer_boundary.mjs
          node tools/renderer_inputs.mjs
          node tools/privacy_projection.mjs
          node tools/privacy_browser.mjs
          node tools/privacy_shell_browser.mjs
          node tools/editor_browser.mjs
          node tools/editor_load_lifecycle_browser.mjs
          node tools/compiler_browser.mjs
      - name: Verify snapshot rollback in browser storage
        run: |
          node tools/snapshot_restore_browser.mjs
          node tools/storage_request_browser.mjs
          node tools/project_creation_browser.mjs
          node tools/verified_project_import_browser.mjs
          node tools/verified_shell_cache_browser.mjs
          node tools/project_edit_browser.mjs
          node tools/project_lifecycle_browser.mjs
          node tools/build_source_browser.mjs
          node tools/build_modules_browser.mjs
          node tools/generation_patch_browser.mjs
          node tools/canonical_model_edits_browser.mjs
          node tools/canonical_generation_ownership_browser.mjs
          node tools/canonical_build_closure_browser.mjs
          node tools/preview_permissions_browser.mjs
          node tools/durable_event_delivery_browser.mjs
          node tools/stateful_application_journeys_browser.mjs
          node tools/command_ownership_registry_browser.mjs
          node tools/portable_build_permission_browser.mjs
          node tools/github_publication_permission_browser.mjs
          node tools/durable_build_work_browser.mjs
          node tools/private_provider_credentials_browser.mjs
          node tools/private_provider_credentials_artifact.mjs
          node tools/semantic_routing_runtime.mjs
          node tools/semantic_routing_browser.mjs
          node tools/semantic_application_discovery_browser.mjs
          node tools/chat_queue_runtime.mjs
          node tools/version_preview_runtime.mjs
          node tools/version_preview_browser.mjs
          node tools/durable_version_preview_browser.mjs
          node tools/verified_working_tree_browser.mjs
          node tools/durable_prompt_library_browser.mjs
          node tools/builtin_themes_projection.mjs --check
          node tools/durable_theme_library_browser.mjs
          node tools/sidebar_tool_access_browser.mjs
          node tools/live_main_integration_browser.mjs
          node tools/source_bound_gallery_browser.mjs
          node tools/initial_project_theme_browser.mjs
          node tools/module_presentation_browser.mjs
          node tools/large_module_presentation_browser.mjs
          node tools/kernel_owner_readiness_browser.mjs
          node tools/kernel_owner_handoff_browser.mjs
          node tools/renderer_stylesheet_identity_browser.mjs
          node tools/atomic_browser_settings_browser.mjs
          node tools/atomic_chat_preferences_browser.mjs
          node tools/read_only_chat_execution_browser.mjs
          node tools/chat_model_picker_scope_browser.mjs
          node tools/site_relay_authorization_browser.mjs
          node tools/browser_window_coordination_browser.mjs
          node tools/message_linked_restoration_browser.mjs
          node tools/chat_queue_browser.mjs
          node tools/durable_chat_queue_browser.mjs
          node tools/canonical_version_history_browser.mjs
          node tools/rules_source_browser.mjs
          node tools/inference_effects_browser.mjs
          node tools/inference_consent_browser.mjs
          node tools/exact_representation_browser.mjs
          node tools/provider_key_browser.mjs
          node tools/covers_browser.mjs
      - name: Recompile the exact host projection and compare its receipt
        run: |
          node tools/host_bundle.mjs --check
          node tools/host_bundle_runtime.mjs
      - name: The site's Featherless relay takes only the site's offered, bounded chat requests, and keeps its key private
        run: node --test relay/featherless/worker.test.mjs
      - name: Every shell script parses the way the browser parses it
        run: node tools/shell_parse.mjs
      - name: The build screen opens Dark, keeps its own choice, and leaves the home look alone
        run: node tools/build_look.mjs
      - name: The kernel in the shell is the holo KERNEL_REV pins, and every vector replays
        run: |
          node tools/kernel.mjs --check
          node tools/kernel_browser.mjs
      - name: The Experience gate, the stylesheet held to the kernel's answers (FK-16 to FK-21)
        run: node tools/experience.mjs --check
      - name: The Prism journey in the shell is prism-code's, byte for byte
        run: node tools/prism_journey.mjs --check
      - name: The commit Forge makes on a template instance is prism-code's, byte for byte
        run: node tools/prism_template.mjs --check
      - name: The live frame's shadcn/ui components are the vendored ones, and rebuild byte for byte
        run: (cd live-src && npm ci --no-audit --no-fund) && node tools/live_components.mjs --check
      - name: The live preview draws the spec, and only the spec
        run: node tools/live_preview.mjs --check
      - name: The decision table decides as the rules do, on every request
        run: node tools/live_table.mjs --check
      - name: Every word on the live screen is edited in the spec, and only there
        run: node tools/live_edit.mjs --check
      - name: An app's canonical LexLean module is its source, and its obligations agree with the table
        run: node tools/live_lexlean.mjs --check
      - name: Lean proves the obligations sound once for every model, and its kernel decides the fixture's
        run: |
          node tools/live_proof.mjs --check
          export PATH="$HOME/.elan/bin:$PATH"
          cd proof && lake build && lake env lean PrismLive/Axioms.lean | tee axioms.txt
          test "$(grep -c 'depends on axioms: \[propext, Quot.sound\]' axioms.txt)" = 2
      - name: A published app's card draws what its live preview draws
        run: node tools/published_preview.mjs --check
      - name: Nothing in this repository names Forge's old home
        run: node tools/self_contained.mjs
