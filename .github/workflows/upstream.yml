# Watches the upstream fixes upstream.toml records, and lands the re-pins it proposes: a proposal the
# workflow token opens starts no CI, so the watcher dispatches the acceptance gate on it and merges it
# once that gate passed on its exact head. Each hour it pins a patched
# SDK image a row names (adopting a fix is adding its row), and asks whether a
# release ships each fix; when one does, it opens an issue naming that release
# and dispatches the re-pin (template-update.yml, which opens the pull request).
# An upstream pull request closed without merging gets an issue too. Nobody has
# to remember to check: the patch is replaced by its release the hour the
# release exists. Ported from prism-devrel.
name: upstream

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  watch:
    name: pin patched SDKs and find the releases that ship our upstream fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report every patch, open issues and dispatch pins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/ci/upstream.py --act | tee -a "$GITHUB_STEP_SUMMARY"
