name: Try Prism page and the canonical frame

on:
  push:
    branches: [main]
  pull_request:
    # Forge (studio/) is not read by the try page, the frame, the identity page or the try codespace: a pull
    # request that changes only Forge does not wait for them.
    paths-ignore:
      - "studio/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: try-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: headless browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install the test runner
        run: npm install
      - name: Chromium, kept by the test runner's Playwright version
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}-chromium-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium
        # The runner image carries the libraries Chromium needs (it ships Chrome itself), so no system
        # packages are installed: they come from Ubuntu's mirror, which has failed runs for want of DNS.
        # Only if the browser cannot start are they installed, with apt's own retries.
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npx playwright install chromium && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep $((attempt * 20))
          done
          if ! node -e 'require("playwright").chromium.launch().then((b) => b.close())'; then
            for attempt in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update && npx playwright install-deps chromium && break
              [[ $attempt -lt 3 ]] || exit 1
              sleep $((attempt * 30))
            done
          fi
      - name: Verify, answer add 20 22 and replay 22/22
        run: npm run test:try
      - name: Prism accounts - every signature check refuses, and the passkey flow signs in
        run: npm run test:identity
      - name: Build the canonical frame every Prism app loads
        run: node frame/publish.mjs "$RUNNER_TEMP/frame" "$GITHUB_SHA"
      - name: Build the sign-in page for id.uor.foundation, pinned by hash
        run: node identity/publish.mjs "$RUNNER_TEMP/identity" "$GITHUB_SHA"

  deploy:
    name: publish the try page and the canonical frame
    # Repositories made from this template have no Pages site for this page.
    if: github.repository == 'UOR-Foundation/template' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # Every Prism app loads the frame from here at run time, so publishing
      # main's frame is how a frame change reaches every app: no app rebuilds.
      - name: Install the frame's minifier, the exact version package-lock.json pins
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assemble the try page and the canonical frame
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp -r try/. "$RUNNER_TEMP/site/"
          node frame/publish.mjs "$RUNNER_TEMP/site/frame" "$GITHUB_SHA"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload the try page and the frame
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          # v4 and later leave dotfiles out unless asked: the shell's closure lists .nojekyll, and the
          # worker refuses to install a closure with a file missing, so without this no preview is served.
          include-hidden-files: true
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
