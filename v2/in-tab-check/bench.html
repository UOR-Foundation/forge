<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In-tab check: measurements</title>
<style>body{font:14px/1.4 system-ui;margin:16px;max-width:900px}pre{white-space:pre-wrap;word-break:break-all;background:#f4f4f4;padding:12px}</style>
<h1>In-tab check: measurements</h1>
<p id="state">starting</p>
<pre id="out"></pre>
<script type="module">
import { createClient } from "./client.mjs";

const RUNS = Number(new URLSearchParams(location.search).get("runs") ?? 12);
const state = document.getElementById("state"), out = document.getElementById("out");
const text = async (url) => (await fetch(url)).text();
const stats = (list) => { const s = [...list].sort((a, b) => a - b); const r = (x) => Math.round(x * 10) / 10; return { median: r((s[(s.length - 1) >> 1] + s[s.length >> 1]) / 2), worst: r(s.at(-1)), best: r(s[0]), n: s.length }; };
const manifest = await (await fetch("./checker.json")).json();
const report = { userAgent: navigator.userAgent, cores: navigator.hardwareConcurrency, isolated: crossOriginIsolated, manifest };

// The bytes, by address: from the Cache API when it holds them, else from the network and into the cache.
const names = { checker: "./dist/lexlean-tab.wasm", pack: "./pack.json" };
const fetched = {};
async function bytesOf(name, address) {
  const cache = await caches.open("in-tab-check"), key = new Request(`/by-address/${address}`);
  let t = performance.now(), hit = await cache.match(key);
  if (!hit) {
    const response = await fetch(names[name]);
    const body = await response.arrayBuffer();
    const entry = performance.getEntriesByName(new URL(names[name], location).href).at(-1);
    fetched[name] = { from: "network", ms: performance.now() - t, bytes: body.byteLength, transferBytes: entry?.encodedBodySize };
    await cache.put(key, new Response(body.slice(0), { headers: { "content-type": "application/octet-stream" } }));
    return body;
  }
  const body = await hit.arrayBuffer();
  fetched[name] = { from: "cache", ms: performance.now() - t, bytes: body.byteLength };
  return body;
}
const makeWorker = () => new Worker("./worker.mjs", { type: "module" });

try {
  if (new URLSearchParams(location.search).has("fresh")) await caches.delete("in-tab-check");
  // First visit, then eleven more starts with the bytes held locally: each start is a new worker.
  const starts = { toReady: [], hash: [], compile: [], instantiate: [], version: [], warm: [], firstCheck: [], fetchChecker: [] };
  const guests = await text("../hosted-check/corpus/guests-2/App.lex.tex");
  const malformed = await text("../hosted-check/corpus/broken/malformed-syntax/App.lex.tex");
  const wrongType = await text("../hosted-check/corpus/broken/wrong-type/App.lex.tex");
  const payment = await text("../hosted-check/corpus/payment/Payment.lex.tex");
  const approval = await text("../hosted-check/corpus/payment/PaymentApproval.lex.tex");
  let client;
  for (let i = 0; i < RUNS; i++) {
    state.textContent = `start ${i + 1} of ${RUNS}`;
    const t = performance.now();
    let detail;
    client = createClient({ makeWorker, manifest, bytesOf, onState: (s, d) => { if (s === "ready") detail = d; } });
    await client.start();
    const ready = performance.now();
    const first = await client.check(guests.replace('"Guests"', `"Guests start ${i}"`));
    const done = performance.now();
    if (i === 0) { report.firstVisit = { fetched: structuredClone(fetched), toReadyMs: ready - t, loadMs: detail.loadMs, warmMs: detail.warmMs, firstCheckMs: done - ready, by: detail.by }; continue; }
    starts.toReady.push(ready - t); starts.fetchChecker.push(fetched.checker.ms);
    for (const k of ["hash", "compile", "instantiate", "version"]) starts[k].push(detail.loadMs[k]);
    starts.warm.push(detail.warmMs); starts.firstCheck.push(done - ready);
    if (!first.ok) throw new Error("guests-2 was refused");
  }
  report.laterStarts = Object.fromEntries(Object.entries(starts).map(([k, v]) => [k, stats(v)]));

  // Checks on the one warm worker. Each edit changes a string, so no result is reused.
  const timed = async (label, make, expectOk) => {
    const round = [], inside = [], parts = { check: [], data: [], key: [] };
    for (let i = 0; i < RUNS; i++) {
      state.textContent = `${label} ${i + 1} of ${RUNS}`;
      const [spec, extras] = make(i);
      const t = performance.now();
      const r = await client.check(spec, { extras });
      round.push(performance.now() - t); inside.push(r.ms.total);
      for (const k of Object.keys(parts)) if (r.ms[k] != null) parts[k].push(r.ms[k]);
      if (r.ok !== expectOk || r.cached) throw new Error(`${label}: ok ${r.ok}, cached ${r.cached}`);
    }
    report[label] = { pageRoundTrip: stats(round), insideWorker: stats(inside), ...Object.fromEntries(Object.entries(parts).filter(([, v]) => v.length).map(([k, v]) => [k, stats(v)])) };
  };
  await timed("editedPasses", (i) => [guests.replace('"Guests"', `"Guests ${i}"`), []], true);
  await timed("editedRefusedSyntax", (i) => [malformed.replace('"Guests"', `"Guests ${i}"`), []], false);
  await timed("editedRefusedType", (i) => [wrongType.replace('"Guests"', `"Guests ${i}"`), []], false);
  await timed("editedTwoModules", (i) => [payment.replace('"Payment approval"', `"Payment approval ${i}"`), [approval]], true);
  const again = [];
  for (let i = 0; i < RUNS; i++) { const t = performance.now(); const r = await client.check(guests); if (i && r.cached !== "memory") throw new Error("not reused"); if (i) again.push(performance.now() - t); }
  report.unchangedAgain = stats(again);

  // Throughput: checks a second, one worker, back to back.
  { const t = performance.now(); let n = 0; while (performance.now() - t < 3000) { await client.check(guests.replace('"Guests"', `"G ${n++}"`)); } report.throughput = { checks: n, perSecond: Math.round(n / ((performance.now() - t) / 1000)) }; }

  const mem = await client.ask({ type: "warm" });
  report.linearMemoryMB = Math.round(mem.memoryBytes / 1048576);
  if (performance.measureUserAgentSpecificMemory) { try { const m = await performance.measureUserAgentSpecificMemory(); report.agentMemoryMB = Math.round(m.bytes / 1048576); report.agentMemoryBreakdown = m.breakdown.filter((b) => b.bytes > 1048576).map((b) => ({ mb: Math.round(b.bytes / 1048576), types: b.types, scope: b.attribution.map((a) => a.scope) })); } catch (e) { report.agentMemory = String(e); } }
  report.workerReach = await client.ask({ type: "probe", url: "https://mcp.uor.foundation/" });
  delete report.workerReach.id;
  report.workerReachSameOrigin = (await client.ask({ type: "probe", url: "./pack.json" })).network;
  state.textContent = "done";
} catch (e) { report.error = { code: e.code, message: e.message }; state.textContent = `failed: ${e.message}`; }
out.textContent = JSON.stringify(report, null, 1);
window.__bench = report;
</script>
