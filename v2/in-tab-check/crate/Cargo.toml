# The in-tab checker: LexLean's own command-line entry, linked as a WebAssembly library whose instance stays alive
# between checks. It holds no rule of its own. `lexlean` is the pinned crate with upstream/wasm-check.patch applied.
[package]
name = "lexlean-tab"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lexlean = { path = "../../../../lexlean" }
camino = "1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
