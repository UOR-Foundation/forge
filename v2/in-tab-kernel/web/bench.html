<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean kernel in the tab</title>
<style>body{font:14px/1.5 system-ui,sans-serif;margin:16px;max-width:60rem}pre{white-space:pre-wrap;word-break:break-word}</style>
<h1>Lean 4.32.1's kernel in this tab</h1>
<p id="status">Starting.</p>
<pre id="out"></pre>
<script type="module">
// Fetches the pinned files, opens the worker, judges every input and the planted faults, and leaves the result on
// window.__bench for a driver to read. ?runs=N repeats the checks; ?whole=1 also judges one input from nothing.
const params = new URLSearchParams(location.search);
const runs = Number(params.get("runs") ?? 5);
const status = (s) => { document.getElementById("status").textContent = s; };
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
const get = async (path) => { const t = performance.now(); const r = await fetch(path); if (!r.ok) throw new Error(path + " " + r.status); const b = await r.arrayBuffer(); return { bytes: b, ms: performance.now() - t }; };

function ask(worker, message, transfer = []) {
  return new Promise((resolve) => {
    const on = ({ data }) => { if (data.op === message.op || data.id === message.id) { worker.removeEventListener("message", on); resolve(data); } };
    worker.addEventListener("message", on);
    worker.postMessage(message, transfer);
  });
}

async function bench() {
  const result = { userAgent: navigator.userAgent, crossOriginIsolated: self.crossOriginIsolated, sharedArrayBuffer: typeof SharedArrayBuffer !== "undefined", deviceMemory: navigator.deviceMemory ?? null, cores: navigator.hardwareConcurrency ?? null };
  const manifest = await (await fetch("../dist/manifest.json")).json();
  status("Fetching the kernel and the library.");
  const t0 = performance.now();
  const [glue, wasm, library] = await Promise.all([get("../dist/" + manifest.glue.file), get("../dist/" + manifest.wasm.file), get("../dist/" + manifest.library.file)]);
  result.fetchMs = performance.now() - t0;
  const worker = new Worker("./worker.mjs", { type: "module" });
  status("Opening the kernel.");
  const t1 = performance.now();
  const opened = await ask(worker, { op: "open", manifest, glue: glue.bytes.slice(0), wasm: wasm.bytes.slice(0), library: library.bytes.slice(0) });
  result.open = { ...opened, totalMs: performance.now() - t1 };
  if (!opened.ok) return result;

  result.inputs = {};
  let n = 0;
  for (const input of manifest.inputs) {
    status(`Judging ${++n} of ${manifest.inputs.length}.`);
    const suffix = (await get("../dist/" + input.file)).bytes;
    const times = [];
    let last;
    for (let i = 0; i < runs; i++) {
      const t = performance.now();
      last = await ask(worker, { op: "check", id: input.sha256 + ":" + i, suffix: suffix.slice(0), sha256: input.suffixSha256 });
      times.push({ kernelMs: last.ms, roundTripMs: performance.now() - t });
    }
    const med = (k) => times.map((x) => x[k]).sort((a, b) => a - b)[Math.floor(times.length / 2)];
    const worst = (k) => Math.max(...times.map((x) => x[k]));
    result.inputs[input.sha256] = { accepted: last.accepted, expected: input.accepted, agree: last.accepted === input.accepted, kernelMs: med("kernelMs"), roundTripMs: med("roundTripMs"), worstRoundTripMs: worst("roundTripMs"), heapMB: last.heapMB, output: last.output ?? last.refusal };
  }

  // Planted faults at the address boundary: each must be refused before the kernel runs.
  const first = manifest.inputs[0];
  const good = (await get("../dist/" + first.file)).bytes;
  const flipped = new Uint8Array(good.slice(0)); flipped[flipped.length >> 1] ^= 1;
  const altered = await ask(worker, { op: "check", id: "fault:altered-bundle", suffix: flipped.buffer, sha256: first.suffixSha256 });
  const badLibrary = new Uint8Array(library.bytes.slice(0)); badLibrary[badLibrary.length >> 1] ^= 1;
  const w2 = new Worker("./worker.mjs", { type: "module" });
  const alteredLibrary = await ask(w2, { op: "open", manifest, glue: glue.bytes.slice(0), wasm: wasm.bytes.slice(0), library: badLibrary.buffer });
  w2.terminate();
  const badWasm = new Uint8Array(wasm.bytes.slice(0)); badWasm[badWasm.length - 1] ^= 1;
  const w3 = new Worker("./worker.mjs", { type: "module" });
  const alteredKernel = await ask(w3, { op: "open", manifest, glue: glue.bytes.slice(0), wasm: badWasm.buffer, library: library.bytes.slice(0) });
  w3.terminate();
  result.faults = {
    alteredBundle: { refused: altered.accepted !== true && !!altered.refusal, says: altered.refusal ?? altered.output },
    alteredLibrary: { refused: alteredLibrary.ok === false, says: alteredLibrary.refusal },
    alteredKernel: { refused: alteredKernel.ok === false, says: alteredKernel.refusal },
  };

  if (params.get("whole") === "1") {
    status("Judging one input from nothing.");
    const whole = new Uint8Array(library.bytes.byteLength + good.byteLength);
    whole.set(new Uint8Array(library.bytes), 0); whole.set(new Uint8Array(good), library.bytes.byteLength);
    const t = performance.now();
    const r = await ask(worker, { op: "whole", id: "whole", bytes: whole.buffer }, [whole.buffer]);
    result.whole = { accepted: r.accepted, kernelMs: r.ms, roundTripMs: performance.now() - t, heapMB: r.heapMB, output: r.output };
  }
  worker.terminate();
  const rows = Object.values(result.inputs);
  result.summary = { inputs: rows.length, agree: rows.filter((r) => r.agree).length, faultsRefused: Object.values(result.faults).filter((f) => f.refused).length, faults: 3 };
  return result;
}

bench().then((r) => { window.__bench = r; status(r.summary ? `Done: ${r.summary.agree} of ${r.summary.inputs} verdicts agree; ${r.summary.faultsRefused} of 3 address faults refused.` : "Stopped: " + (r.open?.refusal ?? "unknown")); document.getElementById("out").textContent = JSON.stringify(r, null, 1); })
  .catch((e) => { window.__bench = { error: String(e && e.stack || e) }; status("Failed: " + e); });
</script>
