name = "prism-featherless"
main = "worker.mjs"
compatibility_date = "2026-10-01"
# Forge reaches it at https://prism-featherless.<account>.workers.dev/v1/chat/completions
# (RELAY in studio/shell/inference-effects.mjs).
workers_dev = true
preview_urls = false

[vars]
# The pages that may use the relay, exactly as a browser sends Origin.
ALLOWED_ORIGINS = "https://uor-foundation.github.io"
# The models Forge offers through the site's key (FEATHERLESS_MODELS in studio/shell/host.js).
MODELS = "zai-org/GLM-5.3-Flash"
# The most a single answer may write (Forge asks for 32,768: GLM reasons before it answers).
MAX_TOKENS = "32768"

# Each visitor (by address) may send this many requests a minute.
[[ratelimits]]
name = "PER_VISITOR"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# The key itself is a secret, never in this file: wrangler secret put FEATHERLESS_KEY
